[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zaszlo"
version = "0.1.0"
description = "Flag algebra method for extremal combinatorics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "clarabel",
    "scipy",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]
tutorial = ["matplotlib", "networkx", "jupyter"]

[project.urls]
Repository = "https://github.com/vanmagnan/zaszlo"

[tool.setuptools.packages.find]
where = ["."]
include = ["zaszlo*"]
